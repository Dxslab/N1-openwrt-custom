name: Build N1 OpenWrt

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish successful firmware to Releases for Amlogic online updates
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: n1-firmware-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Hong_Kong
  IMMORTALWRT_COMMIT: af0775ab50d2d0e41f4e558c59208f6c9b8bdf0b
  OPENCLASH_COMMIT: e553e82e01c697aefbe1555261a503f425e00ccd
  AMLOGIC_COMMIT: 869a7ae501d54d9b94742a1165df374b2a4d0e69
  PACKIT_COMMIT: a46b4f5d201ab99eba0ddc7c2e7cd67412fc3d5c
  FLIPPY_KERNEL: 6.12.114
  MIHOMO_VERSION: v1.19.33
  MIHOMO_SHA256: ba408b317080ee265c46cb923a50018c1b82cbd708551cdd46a1e3e307396187

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout ImmortalWrt 24.10
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: ${{ env.IMMORTALWRT_COMMIT }}
          path: openwrt
          persist-credentials: false

      - name: Checkout OpenClash
        uses: actions/checkout@v4
        with:
          repository: vernesong/OpenClash
          ref: ${{ env.OPENCLASH_COMMIT }}
          path: openclash-source
          persist-credentials: false

      - name: Checkout Flippy packager
        uses: actions/checkout@v4
        with:
          repository: unifreq/openwrt_packit
          ref: ${{ env.PACKIT_COMMIT }}
          path: packit-source
          persist-credentials: false

      - name: Checkout Amlogic Service
        uses: actions/checkout@v4
        with:
          repository: ophub/luci-app-amlogic
          ref: ${{ env.AMLOGIC_COMMIT }}
          path: amlogic-source
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev python3 python3-pyelftools \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq \
            time util-linux btrfs-progs dosfstools parted pigz libarchive-tools \
            xz-utils zstd qemu-utils p7zip-full patch diffutils cpio
          df -h . /opt

      - name: Configure minimal rootfs
        run: bash scripts/prepare-build.sh

      - name: Download verified ARM64 proxy core
        run: |
          python3 scripts/prepare-core.py \
            "$MIHOMO_VERSION" "$MIHOMO_SHA256" \
            openwrt/files/etc/openclash/core/clash_meta

      - name: Download source archives
        working-directory: openwrt
        run: |
          set -o pipefail
          make download -j4 V=s 2>&1 | tee ../build-download.log

      - name: Compile rootfs
        working-directory: openwrt
        run: |
          set -o pipefail
          if ! make -j2 V=s 2>&1 | tee ../build.log; then
            echo 'Retry once with one compiler process for diagnostic output.'
            make -j1 V=s 2>&1 | tee -a ../build.log
          fi

      - name: Verify rootfs and collect build records
        run: |
          mkdir -p artifacts
          python3 scripts/check-rootfs.py \
            openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          cp openwrt/.config artifacts/immortalwrt-full.config
          cp openwrt/feeds.conf.default artifacts/feeds.conf
          cp openwrt/bin/targets/armsr/armv8/*.manifest artifacts/
          {
            echo "Configuration repository: $GITHUB_REPOSITORY@$GITHUB_SHA"
            echo "ImmortalWrt: $IMMORTALWRT_COMMIT (openwrt-24.10)"
            echo "OpenClash: $OPENCLASH_COMMIT"
            echo "Amlogic Service: $AMLOGIC_COMMIT"
            echo "openwrt_packit: $PACKIT_COMMIT"
            echo "Flippy kernel archive: ophub/kernel kernel_flippy $FLIPPY_KERNEL"
            echo "Mihomo: $MIHOMO_VERSION"
            date -Iseconds
            for feed in packages luci routing; do
              printf '%s: ' "$feed"
              git -C "openwrt/feeds/$feed" rev-parse HEAD
            done
          } > artifacts/build-info.txt

      - name: Package N1 image with Flippy kernel
        env:
          OPENWRT_ARMSR: ${{ github.workspace }}/openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          PACKAGE_SOC: s905d
          KERNEL_REPO_URL: ophub/kernel
          KERNEL_VERSION_NAME: ${{ env.FLIPPY_KERNEL }}
          KERNEL_AUTO_LATEST: 'false'
          SELECT_PACKITPATH: n1-packit
          OPENWRT_IP: 192.168.1.2
          WHOAMI: Dxslab
          OPENWRT_VER: N1-ImmortalWrt-24.10
          DISTRIB_REVISION: N1-24.10-${{ github.run_number }}
          DISTRIB_DESCRIPTION: ImmortalWrt N1 Custom
          SW_FLOWOFFLOAD: '0'
          SFE_FLOW: '0'
          HW_FLOWOFFLOAD: '0'
          ENABLE_WIFI_K504: '0'
          ENABLE_WIFI_K510: '0'
          GZIP_IMGS: .gz
          SAVE_OPENWRT_ROOTFS: 'false'
        run: |
          # Use the checked-out revision, including the packager's internal copy.
          sudo mkdir -p /opt/n1-packit
          sudo cp -a packit-source/. /opt/n1-packit/
          sudo chown -R "$(id -u):$(id -g)" /opt/n1-packit
          # N1's upstream script hard-codes Wi-Fi on; disable it for this build.
          sed -i 's/^ENABLE_WIFI_K510=1$/ENABLE_WIFI_K510=0/' \
            /opt/n1-packit/mk_s905d_n1.sh
          set -o pipefail
          bash /opt/n1-packit/openwrt_flippy.sh 2>&1 | tee package.log

      - name: Verify image and prepare download
        run: |
          shopt -s nullglob
          images=(/opt/n1-packit/output/*s905d*n1*.img.gz)
          if [ "${#images[@]}" -ne 1 ]; then
            printf 'Expected one N1 image, found %s\n' "${#images[@]}" >&2
            exit 1
          fi
          python3 scripts/check-image.py "${images[0]}" > artifacts/image-check.txt
          cat artifacts/image-check.txt
          cp "${images[0]}" artifacts/
          cp docs/FIRST-BOOT.md artifacts/
          (
            cd artifacts
            sha256sum ./*.img.gz > SHA256SUMS
          )
          cat > artifacts/release-notes.md <<'EOF'
          N1 firmware: ImmortalWrt 24.10 user space, Flippy 6.12 kernel,
          OpenClash, Amlogic Service and web terminal.

          LAN: http://192.168.1.2 ; gateway/DNS: 192.168.1.1.
          DHCP server, IPv6 and Wi-Fi are disabled on N1.
          Verify SHA256SUMS and test USB boot before writing eMMC.
          This build does not configure failover on the primary router.
          EOF
          {
            echo '## N1 firmware built'
            echo '- Download the **N1-firmware** artifact below.'
            echo '- Test the .img.gz on a USB drive before touching eMMC.'
            echo '- LAN: http://192.168.1.2 ; gateway/DNS: 192.168.1.1.'
            echo '- DHCP server, IPv6 and Wi-Fi are disabled on N1.'
            echo '- Set the root password at first login; import your own OpenClash config.'
            echo '- Main-router failover is a separate configuration and is not enabled yet.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: N1-firmware-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: N1-build-logs-${{ github.run_number }}
          path: |
            *.log
            openwrt/.config
            openwrt/logs/
            artifacts/build-info.txt
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: ${{ inputs.publish_release }}
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: N1-firmware-${{ github.run_number }}
          path: firmware

      - name: Publish firmware for Amlogic online updates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd firmware
          sha256sum -c SHA256SUMS
          gh release create "N1-${GITHUB_RUN_NUMBER}" \
            --target "$GITHUB_SHA" \
            --title "N1 firmware build ${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md \
            ./*.img.gz SHA256SUMS build-info.txt image-check.txt FIRST-BOOT.md
